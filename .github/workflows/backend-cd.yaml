name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Backend Code Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python runtime (v3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv packaging tool
        run: pip install pipenv

      - name: Cache Pipenv virtual environment
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-backend-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            pipenv-${{ runner.os }}-backend-

      - name: Install dependencies cleanly
        run: pipenv install --dev

      - name: Execute Flake8 code linter
        run: pipenv run lint

  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python runtime (v3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv packaging tool
        run: pip install pipenv

      - name: Cache Pipenv virtual environment
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-backend-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            pipenv-${{ runner.os }}-backend-

      - name: Install dependencies cleanly
        run: pipenv install --dev

      - name: Execute Pytest test suite
        run: pipenv run test

  build:
    name: Build & Push Docker Image to ECR
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Configuration
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "aws_available=true" >> $GITHUB_OUTPUT
            echo "AWS credentials configured."
          else
            echo "aws_available=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS credentials not set in repository secrets. Falling back to local Docker build & Git SHA tagging."
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.aws_available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Authenticate with Amazon ECR
        if: steps.check-aws.outputs.aws_available == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Docker Image
        id: build-image
        env:
          HAS_AWS: ${{ steps.check-aws.outputs.aws_available }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPO || 'backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$HAS_AWS" == "true" ]; then
            REPO_NAME=$(echo "$ECR_REPOSITORY" | awk -F'/' '{print $NF}')
            TARGET_IMAGE="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
            LATEST_IMAGE="$ECR_REGISTRY/$REPO_NAME:latest"

            echo "Building backend Docker image ($TARGET_IMAGE)..."
            docker build \
              --tag "$TARGET_IMAGE" \
              --tag "$LATEST_IMAGE" \
              starter/backend

            echo "Pushing backend Docker image to ECR ($TARGET_IMAGE)..."
            docker push "$TARGET_IMAGE"
            docker push "$LATEST_IMAGE"
            echo "image_uri=$TARGET_IMAGE" >> $GITHUB_OUTPUT
          else
            TARGET_IMAGE="backend:$IMAGE_TAG"
            echo "Building and tagging backend Docker image locally with Git SHA: $TARGET_IMAGE"
            docker build \
              --tag "$TARGET_IMAGE" \
              --tag "backend:latest" \
              starter/backend
            echo "image_uri=$TARGET_IMAGE" >> $GITHUB_OUTPUT
          fi

      - name: Step Summary - Build Artifacts
        if: always()
        run: |
          echo "### 📦 Backend Image Build & Registry Push" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag (Git SHA):** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Image:** \`${{ steps.build-image.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy Backend to EKS Cluster
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Configuration
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "aws_available=true" >> $GITHUB_OUTPUT
          else
            echo "aws_available=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS credentials not set in secrets. Running Kustomize manifest verification."
          fi

      - name: Install Kustomize CLI
        uses: imranismail/setup-kustomize@v2

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.aws_available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Authenticate with Amazon ECR
        if: steps.check-aws.outputs.aws_available == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure Kubernetes kubeconfig for EKS
        if: steps.check-aws.outputs.aws_available == 'true'
        env:
          CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          echo "Updating kubeconfig for cluster: $CLUSTER_NAME in $AWS_REGION"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Update Manifests with Git SHA Image and Apply / Validate
        id: deploy-k8s
        env:
          HAS_AWS: ${{ steps.check-aws.outputs.aws_available }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.BACKEND_ECR_REPO || 'backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/backend/k8s
          if [ "$HAS_AWS" == "true" ]; then
            REPO_NAME=$(echo "$ECR_REPOSITORY" | awk -F'/' '{print $NF}')
            FULL_IMAGE_NAME="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
            echo "Updating Kustomize image configuration: backend -> $FULL_IMAGE_NAME"
            kustomize edit set image backend="$FULL_IMAGE_NAME"
            echo "Applying Kubernetes manifests via Kustomize..."
            kustomize build | kubectl apply -f -
            echo "Awaiting backend deployment rollout status..."
            kubectl rollout status deployment/backend -n default --timeout=180s
          else
            echo "Updating Kustomize image configuration with Git SHA: backend -> backend:$IMAGE_TAG"
            kustomize edit set image backend="backend:$IMAGE_TAG"
            echo "Validating Kubernetes manifests generation via Kustomize..."
            kustomize build
            echo "✅ Kustomize manifests validated successfully with Git SHA tag: backend:$IMAGE_TAG"
          fi

      - name: Publish Deployment Summary
        if: success()
        run: |
          echo "## 🎉 Backend Deployment Pipeline Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment** | \`deployment/backend\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag (Git SHA)** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Manifest Status** | ✅ Validated & Applied |" >> $GITHUB_STEP_SUMMARY
