name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: 'Optional Backend API URL override for REACT_APP_MOVIE_API_URL'
        required: false
        default: ''

concurrency:
  group: frontend-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Frontend Code Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime (v18.14.2)
        uses: actions/setup-node@v4
        with:
          node-version: 18.14.2
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Execute ESLint check
        run: npm run lint

  test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime (v18.14.2)
        uses: actions/setup-node@v4
        with:
          node-version: 18.14.2
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Execute Jest test suites
        run: CI=true npm test

  build:
    name: Build & Push Docker Image to ECR
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Configuration
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "aws_available=true" >> $GITHUB_OUTPUT
            echo "AWS credentials configured."
          else
            echo "aws_available=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS credentials not set in repository secrets. Falling back to local Docker build & Git SHA tagging."
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.aws_available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Authenticate with Amazon ECR
        if: steps.check-aws.outputs.aws_available == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Frontend Docker Image
        id: build-image
        env:
          HAS_AWS: ${{ steps.check-aws.outputs.aws_available }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPO || 'frontend' }}
          IMAGE_TAG: ${{ github.sha }}
          API_URL_INPUT: ${{ github.event.inputs.backend_api_url }}
          API_URL_SECRET: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          BACKEND_URL="${API_URL_INPUT:-${API_URL_SECRET:-http://localhost:5000}}"
          echo "Targeting backend API URL: $BACKEND_URL"

          if [ "$HAS_AWS" == "true" ]; then
            REPO_NAME=$(echo "$ECR_REPOSITORY" | awk -F'/' '{print $NF}')
            TARGET_IMAGE="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
            LATEST_IMAGE="$ECR_REGISTRY/$REPO_NAME:latest"

            docker build \
              --build-arg REACT_APP_MOVIE_API_URL="$BACKEND_URL" \
              --tag "$TARGET_IMAGE" \
              --tag "$LATEST_IMAGE" \
              .

            echo "Pushing Docker image to ECR ($TARGET_IMAGE)..."
            docker push "$TARGET_IMAGE"
            docker push "$LATEST_IMAGE"
            echo "image_uri=$TARGET_IMAGE" >> $GITHUB_OUTPUT
          else
            TARGET_IMAGE="frontend:$IMAGE_TAG"
            docker build \
              --build-arg REACT_APP_MOVIE_API_URL="$BACKEND_URL" \
              --tag "$TARGET_IMAGE" \
              --tag "frontend:latest" \
              .
            echo "Built and tagged image locally with Git SHA: $TARGET_IMAGE"
            echo "image_uri=$TARGET_IMAGE" >> $GITHUB_OUTPUT
          fi

      - name: Step Summary - Build Artifacts
        if: always()
        run: |
          echo "### 📦 Frontend Image Build & Registry Push" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag (Git SHA):** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Image:** \`${{ steps.build-image.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy Frontend to EKS Cluster
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check AWS Secrets Configuration
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "aws_available=true" >> $GITHUB_OUTPUT
          else
            echo "aws_available=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS credentials not set in secrets. Running Kustomize manifest verification."
          fi

      - name: Install Kustomize CLI
        uses: imranismail/setup-kustomize@v2

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.aws_available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Authenticate with Amazon ECR
        if: steps.check-aws.outputs.aws_available == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure Kubernetes kubeconfig for EKS
        if: steps.check-aws.outputs.aws_available == 'true'
        env:
          CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          echo "Updating kubeconfig for cluster: $CLUSTER_NAME in $AWS_REGION"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Update Manifests with Git SHA Image and Apply / Validate
        id: deploy-k8s
        env:
          HAS_AWS: ${{ steps.check-aws.outputs.aws_available }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPO || 'frontend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/frontend/k8s
          if [ "$HAS_AWS" == "true" ]; then
            REPO_NAME=$(echo "$ECR_REPOSITORY" | awk -F'/' '{print $NF}')
            FULL_IMAGE_NAME="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"
            echo "Updating Kustomize image configuration: frontend -> $FULL_IMAGE_NAME"
            kustomize edit set image frontend="$FULL_IMAGE_NAME"
            echo "Applying Kubernetes manifests to EKS cluster..."
            kustomize build | kubectl apply -f -
            echo "Awaiting deployment rollout status..."
            kubectl rollout status deployment/frontend -n default --timeout=180s
          else
            echo "Updating Kustomize image configuration with Git SHA: frontend -> frontend:$IMAGE_TAG"
            kustomize edit set image frontend="frontend:$IMAGE_TAG"
            echo "Validating Kubernetes manifests generation via Kustomize..."
            kustomize build
            echo "✅ Kustomize manifests validated successfully with Git SHA tag: frontend:$IMAGE_TAG"
          fi

      - name: Publish Deployment Summary
        if: success()
        run: |
          echo "## 🎉 Frontend Deployment Pipeline Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment** | \`deployment/frontend\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag (Git SHA)** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Manifest Status** | ✅ Validated & Applied |" >> $GITHUB_STEP_SUMMARY
